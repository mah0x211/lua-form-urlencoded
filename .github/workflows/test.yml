name: test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  head-checks:
    name: Check existing head CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      workflow_state: ${{ steps.head.outputs.workflow_state }}
    steps:
    -
      name: Inspect existing push CI
      if: github.event_name == 'pull_request'
      id: head
      uses: mah0x211/head-checks-status@v1

  luacheck:
    needs: head-checks
    if: >-
      github.event_name == 'push' ||
      !contains(
        fromJSON('["success", "queued", "in_progress"]'),
        needs.head-checks.outputs.workflow_state
      )
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mah0x211/lua-ci:latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Install Tools
      run: luarocks install luacheck
    -
      name: Run luacheck
      run: |
        luacheck .

  test:
    needs: luacheck
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mah0x211/lua-ci:latest
    strategy:
      matrix:
        lua-version:
          - "5.1.:latest"
          - "5.2.:latest"
          - "5.3.:latest"
          - "5.4.:latest"
          - "5.5.:latest"
          - "lj-v2.1:latest"
    steps:
    -
      name: Switch Lua Version
      run: |
        lenv -g use ${{ matrix.lua-version }}
        lua -v || true
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Install
      run: |
        luarocks make
    -
      name: Install Tools
      run: |
        luarocks install testcase
        luarocks install luacov
        luarocks install assert
    -
      name: Run Test
      run: |
        testcase --coverage ./test/
    -
      name: Upload coverage files to Codecov
      uses: codecov/codecov-action@v5
      with:
        use_oidc: true
        disable_search: true
        files: ./luacov.report.out
        flags: unittests
